<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Only Readout's own files may run (pictures may come from outlets' servers, as images only). Even if a feed slipped something past the update jobs, a
       browser obeying this won't load scripts, frames or plug-ins from anywhere else. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; media-src https:; connect-src 'self' https://api.github.com https://api.weather.gov https://earthquake.usgs.gov https://services3.arcgis.com https://cwwp2.dot.ca.gov https://air-quality-api.open-meteo.com https://www.alphavantage.co https://icite.od.nih.gov https://eutils.ncbi.nlm.nih.gov; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- sites you open from Readout aren't told where you came from -->
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Readout</title>
  <meta name="description" content="Body imaging research, led by each paper's own conclusion.">
  <meta name="theme-color" content="#171b1f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e7ecef" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Readout">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/literata-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css?v=62">
</head>
<body>
  <div class="app">
    <header class="head">
      <div class="head-row">
        <h1 class="wordmark" id="title">Readout</h1>
        <span class="head-note" id="head-note"></span>
        <button class="icon-btn" id="btn-search" aria-label="Search papers and news">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <button class="icon-btn" id="btn-refresh" aria-label="Check for new papers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
        <button class="icon-btn" id="btn-info" aria-label="How cards are built">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.5v.01"/></svg>
        </button>
      </div>
      <nav class="chips" id="chips" aria-label="Filter the feed"></nav>
      <div class="wx" id="wx" role="region" aria-label="Weather" hidden></div>
      <div class="banner" id="banner" role="region" aria-label="Upcoming meeting" hidden></div>
    </header>

    <main class="view feed" id="view-feed" aria-label="Feed"></main>
    <div class="ptr" id="ptr" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      <span>Pull to check for new papers</span>
    </div>
    <main class="view" id="view-explore" aria-label="Explore" hidden></main>
    <main class="view" id="view-saved" aria-label="Saved" hidden></main>
    <main class="view" id="view-tune" aria-label="Tune" hidden></main>

    <div class="player" id="player" hidden>
      <div class="pl-bar" aria-hidden="true"><i id="pl-prog"></i></div>
      <button class="icon-btn" id="pl-toggle" aria-label="Play"></button>
      <div class="pl-text"><b id="pl-title"></b><span id="pl-src"></span></div>
      <button class="icon-btn" id="pl-back" aria-label="Back 15 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 3.5v4h4"/></svg><b>15</b>
      </button>
      <button class="icon-btn" id="pl-close" aria-label="Stop and close player">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <audio id="pl-audio" preload="none"></audio>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="feed" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg>
        Feed
      </button>
      <button class="tab" role="tab" data-tab="explore" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V13M9.3 20V9M14.6 20v-5M20 20V4"/></svg>
        Explore
      </button>
      <button class="tab" role="tab" data-tab="saved" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>
        Saved
      </button>
      <button class="tab" role="tab" data-tab="tune" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
        Tune
      </button>
    </nav>
  </div>

  <section class="overlay" id="topic" aria-hidden="true" inert>
    <div class="ov-head">
      <button class="icon-btn" id="topic-back" aria-label="Back to Explore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="topic-title"></h1>
    </div>
    <div class="ov-body" id="topic-body"></div>
  </section>

  <div class="sheet" id="sheet" aria-hidden="true" inert>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-card"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="filters.js?v=62"></script>
  <script src="app.js?v=62"></script>
  <script src="learn.js?v=62"></script>
  <script src="tune.js?v=62"></script>
  <script src="horizon.js?v=62"></script>
  <script src="radar.js?v=62"></script>
  <script src="watch.js?v=62"></script>
  <script src="week.js?v=62"></script>
  <script src="cites.js?v=62"></script>
  <script src="push.js?v=62"></script>
  <script src="jobset.js?v=62"></script>
  <script src="local.js?v=62"></script>
  <script src="near.js?v=62"></script>
</body>
</html>
