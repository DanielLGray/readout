name: Update news

on:
  schedule:
    - cron: "23 */2 * * *"     # every 2 hours GitHub checks; the update runs when the news is 5+ hours old
                               # (about every 6 hours, and soon after a dropped run)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: readout-news      # one run of this job at a time; other jobs write other files
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Already up to date?          # a backup run skips when the data is fresh
        id: due
        run: python3 -m pipeline.due docs/data/news.json 5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt   # exact versions, checked against their published hashes
        if: steps.due.outputs.run == 'true'
      - name: Pull headlines
        if: steps.due.outputs.run == 'true'
        run: python -m pipeline.build_news
      - name: Save to the repository
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "readout-bot"
          git config user.email "readout-bot@users.noreply.github.com"
          git add docs/data cache
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "News update $(date -u +%F\ %H:%M)"
          for i in 1 2 3 4 5; do              # another job may have pushed meanwhile
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
