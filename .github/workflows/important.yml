name: Update most important papers

on:
  schedule:
    - cron: "37 5 * * 2"       # Tuesdays, 05:37 UTC
    - cron: "7 9 * * 2"        # backups if GitHub drops the run; they skip when the list is under 5 days old
    - cron: "37 5 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: readout-important    # one run of this job at a time; other jobs write other files
  cancel-in-progress: false

jobs:
  important:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Already up to date?          # a backup run skips when the data is fresh
        id: due
        run: python3 -m pipeline.due docs/data/important.json 120
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt   # exact versions, checked against their published hashes
        if: steps.due.outputs.run == 'true'
      - name: Rank papers by citations
        if: steps.due.outputs.run == 'true'
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python -m pipeline.build_important
      - name: Save to the repository
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "readout-bot"
          git config user.email "readout-bot@users.noreply.github.com"
          git add docs/data cache
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Most important papers $(date -u +%F)"
          for i in 1 2 3 4 5; do              # another job may have pushed meanwhile
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
