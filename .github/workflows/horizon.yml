name: Update coming up

on:
  schedule:
    - cron: "47 11 * * *"      # daily, early morning in the US (the release calendars change little)
    - cron: "17 15 * * *"      # backup, in case GitHub drops the first; it skips when the first ran
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: readout-horizon
  cancel-in-progress: false

jobs:
  horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main                  # the newest data, not the commit the run was queued at (a run waiting behind another of the same job would start from stale files)
      - name: Already up to date?          # a backup run skips when today's update is done
        id: due
        run: python3 -m pipeline.due docs/data/horizon.json daily
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt   # exact versions, checked against their published hashes
        if: steps.due.outputs.run == 'true'
      - name: Read the calendars
        if: steps.due.outputs.run == 'true'
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}     # BLS asks for a contact email; without it, the dates in the config are used
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}     # sci-fi and fantasy release dates; without it, the list in the config
        run: python -m pipeline.build_horizon
      - name: Save to the repository
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "readout-bot"
          git config user.email "readout-bot@users.noreply.github.com"
          git add docs/data/horizon.json docs/data/horizon.ics docs/data/ics
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Coming up $(date -u +%F)"
          for i in 1 2 3 4 5; do              # another job may have pushed meanwhile
            git pull --rebase -X theirs --autostash && git push && exit 0   # a clash in a data file: this run's copy is the newer one
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
