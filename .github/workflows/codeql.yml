name: CodeQL

# GitHub's code scanner reads the app, the pipeline and these workflow files for security mistakes
# (unsafe links and HTML, injection, token handling) and lists anything it finds under the
# repository's Security tab → Code scanning. Free for public repositories.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/data/**", "cache/**"]   # the update jobs' data: nothing to scan
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 7 * * 6"          # Saturdays: newly written checks look at old code too
  workflow_dispatch: {}

permissions: {}                   # the job below asks for only what it needs

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read              # read the code
      security-events: write      # report findings to the Security tab
      actions: read               # read workflow details, for the workflow-file checks
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
