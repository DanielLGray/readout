name: Update feed

on:
  schedule:
    - cron: "17 4 * * *"       # every day, 04:17 UTC (11:17 PM Eastern), inside NCBI's 9 PM–5 AM off-peak window
    - cron: "47 6 * * *"       # backups, in case GitHub drops a scheduled run: they skip once
    - cron: "37 9 * * *"       #   the feed has been updated today
  workflow_dispatch: {}         # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: readout-feed      # one run of this job at a time; other jobs write other files
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main                  # the newest data, not the commit the run was queued at (a run waiting behind another of the same job would start from stale files)
          persist-credentials: false # the steps that read outside feeds, PubMed and pictures never hold the push token
      - name: Already up to date?          # a backup run skips when the data is fresh
        id: due
        run: python3 -m pipeline.due docs/data/feed.json daily
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt   # exact versions, checked against their published hashes
        if: steps.due.outputs.run == 'true'
      - name: Pull new papers from PubMed
        if: steps.due.outputs.run == 'true'
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python -m pipeline.build_feed
      - name: Save to the repository
        if: steps.due.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}      # only this step can push
        run: |
          # the token for github.com, given here and nowhere earlier; git hooks a build step might have left are ignored
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local core.hooksPath /dev/null
          git config user.name "readout-bot"
          git config user.email "readout-bot@users.noreply.github.com"
          git add docs/data cache
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Feed update $(date -u +%F)"
          for i in 1 2 3 4 5; do              # another job may have pushed meanwhile
            git pull --rebase -X theirs --autostash && git push && exit 0   # a clash in a data file: this run's copy is the newer one
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
