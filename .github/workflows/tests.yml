name: Tests

on:
  push:
    paths: ["pipeline/**", "config/**", "tests/**", "docs/*.js", "docs/*.html", "requirements.txt", "requirements.in"]
  pull_request: {}                # Dependabot's update proposals get tested before you merge them
  workflow_dispatch: {}

permissions:
  contents: read                  # tests only read the code

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt   # exact versions, checked against their published hashes
      - run: pip install "pytest>=8,<10"                         # test tool only; this job can't write or see secrets
      - run: python -m pytest -q
      - name: App scripts parse
        run: for f in docs/*.js; do node --check "$f"; done
