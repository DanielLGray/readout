name: Tests

on:
  push:
    paths: ["pipeline/**", "config/**", "tests/**", "docs/*.js", "docs/*.html", "requirements.txt"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: App scripts parse
        run: for f in docs/*.js; do node --check "$f"; done
