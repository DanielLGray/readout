# Security and version updates, proposed as pull requests you can review and merge on GitHub.
# Monthly and grouped, so it's one proposal per kind rather than a stream of them; the Tests
# workflow runs on each proposal first.
version: 2
updates:
  - package-ecosystem: pip               # requirements.in → the hash-locked requirements.txt
    directory: "/"
    schedule: { interval: monthly }
    groups:
      python-packages: { patterns: ["*"] }
  - package-ecosystem: github-actions    # keeps the pinned action commits current
    directory: "/"
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
