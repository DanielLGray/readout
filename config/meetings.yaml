# ─────────────────────────────────────────────────────────────────────────────
# Readout — meetings. Four months before each one starts, the app shows a banner you
# can close; from a week before until a week after, a chip gathers the news stories
# that mention it (`match`, a regular expression on headlines and summaries).
# Add next year's meetings as their dates are announced. Past meetings can stay:
# they drop out on their own two weeks after they end. `muted: true` starts one switched off.
# ─────────────────────────────────────────────────────────────────────────────

meetings:
  - id: rsna2026
    name: RSNA 2026
    full: Radiological Society of North America, 112th Scientific Assembly and Annual Meeting
    start: 2026-11-29
    end: 2026-12-03
    place: McCormick Place, Chicago
    url: https://www.rsna.org/annual-meeting
    match: '\bRSNA\b|Radiological Society of North America|RSNA 2026|#RSNA26'

  - id: sar2027
    name: SAR 2027
