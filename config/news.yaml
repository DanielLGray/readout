    require: "radiopharm|radioligand|radiotracer|\\btracer|imaging|contrast (?:agent|media)|gadolin|iodinated|\\bPET\\b|positron|\\bSPECT\\b|PSMA|lutetium|gallium|technetium|theranostic|nuclear medicine|mammogra|\\bMRI\\b|\\bCT\\b|computed tomography|ultrasound|radiolog(?:y|ists?)\\b|isotope|Mo-99"
