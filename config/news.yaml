# ─────────────────────────────────────────────────────────────────────────────
# Readout — news: radiology industry outlets + general science & health outlets
#
# Each outlet lists one or more feed addresses. The news job tries them in
# order and uses the first that returns stories, so a site redesign that
# breaks one address doesn't break the tab. Accepted formats: RSS, Atom, and
# Google News sitemaps (sitemap-google-news.xml).
#
# The app shows each story's headline, outlet, date and the short summary the
# outlet puts in its own feed, and links to the article on the outlet's site.
#
# Add an outlet: copy a block. Remove one: delete it. The "Check news feeds"
# step of the Update news run reports which address each outlet is using.
# ─────────────────────────────────────────────────────────────────────────────

settings:
  keep_days: 120          # radiology industry stories older than this leave the feed
  science_keep_days: 30   # science & health stories (many more of them) leave sooner
  max_items: 4000
  archive_days: 730       # headlines kept (titles only) for trend analysis

# kind: industry (default) = radiology industry & business outlets
#       science            = general science & health outlets
# max_per_day: keep at most this many stories per day from an outlet

sources:
  # group: outlets from the same publisher that share stories count once
  # merge: use every working address (an RSS feed plus a sitemap gives more stories)
  # require: keep only stories whose headline/summary match (for general medtech outlets)
  - name: AuntMinnie
    group: auntminnie
    home: https://www.auntminnie.com
    merge: true
    urls:
      - https://www.auntminnie.com/rss
      - https://www.auntminnie.com/sitemap-google-news.xml

  - name: AuntMinnie Europe
    group: auntminnie
    home: https://www.auntminnieeurope.com
    merge: true
    urls:
      - https://www.auntminnieeurope.com/feed
      - https://www.auntminnieeurope.com/sitemap-google-news.xml

  - name: Radiology Business
    home: https://radiologybusiness.com
    urls:
      - https://radiologybusiness.com/rss.xml
      - https://radiologybusiness.com/feed

  - name: Imaging Technology News
    home: https://www.itnonline.com
    merge: true
    urls:
      - https://www.itnonline.com/rss.xml
      - https://www.itnonline.com/sitemap-google-news.xml

  - name: The Imaging Wire
    home: https://theimagingwire.com
    urls:
      - https://theimagingwire.com/feed/

  - name: MedTech Dive
    home: https://www.medtechdive.com
    require: "imaging|radiolog|\\bMRI\\b|\\bCT\\b|\\bPET\\b|ultrasound|X-ray|scanner|mammogra|theranostic|radiopharm|Healthineers|GE HealthCare|Philips|Canon Medical|Hologic|Fujifilm|RadNet"
    urls:
      - https://www.medtechdive.com/feeds/news/

  - name: Signify Research
    home: https://www.signifyresearch.net
    require: "imaging|radiolog|\\bMRI\\b|\\bCT\\b|\\bPET\\b|ultrasound|X-ray|PACS|enterprise imaging|mammogra|theranostic|AI"
    urls:
      - https://www.signifyresearch.net/feed/

  # ── Science & health ──────────────────────────────────────────────────────
  - name: STAT
    kind: science
    max_per_day: 10
    home: https://www.statnews.com
    urls:
      - https://www.statnews.com/feed/

  - name: KFF Health News
    kind: science
    max_per_day: 6
    home: https://kffhealthnews.org
    urls:
      - https://kffhealthnews.org/feed/

  - name: NPR Health
    kind: science
    max_per_day: 6
    home: https://www.npr.org/sections/health
    urls:
      - https://feeds.npr.org/1128/rss.xml

  - name: MedPage Today
    kind: science
    max_per_day: 8
    home: https://www.medpagetoday.com
    urls:
      - https://www.medpagetoday.com/rss/headlines.xml

  - name: BBC Health
    kind: science
    max_per_day: 6
    home: https://www.bbc.com/news/health
    urls:
      - https://feeds.bbci.co.uk/news/health/rss.xml

  - name: ScienceDaily
    kind: science
    max_per_day: 8
    home: https://www.sciencedaily.com/news/health_medicine/
    urls:
      - https://www.sciencedaily.com/rss/top/health.xml
      - https://www.sciencedaily.com/rss/health_medicine.xml

  - name: Science
    kind: science
    max_per_day: 6
    home: https://www.science.org/news
    urls:
      - https://www.science.org/rss/news_current.xml

  - name: Nature
    kind: science
    max_per_day: 6
    home: https://www.nature.com/news
    urls:
      - https://www.nature.com/nature.rss
      - https://feeds.nature.com/nature/rss/current

  - name: New Scientist
    kind: science
    max_per_day: 6
    home: https://www.newscientist.com
    urls:
      - https://www.newscientist.com/subject/health/feed/
      - https://www.newscientist.com/feed/home/

  - name: Science News
    kind: science
    max_per_day: 6
    home: https://www.sciencenews.org
    urls:
      - https://www.sciencenews.org/feed

  - name: Scientific American
    kind: science
    max_per_day: 6
    home: https://www.scientificamerican.com
    urls:
      - https://www.scientificamerican.com/platform/syndication/rss/
      - http://rss.sciam.com/ScientificAmerican-Global

  - name: The Conversation
    kind: science
    max_per_day: 6
    home: https://theconversation.com/us/health
    urls:
      - https://theconversation.com/us/health/articles.atom

  - name: Ars Technica
    kind: science
    max_per_day: 4
    home: https://arstechnica.com/science/
    urls:
      - https://feeds.arstechnica.com/arstechnica/science

  - name: NIH News
    kind: science
    max_per_day: 6
    home: https://www.nih.gov/news-events/news-releases
    urls:
      - https://www.nih.gov/news-releases/feed.xml
      - https://www.nih.gov/news-events/news-releases/feed

# Business categories (chips in the News tab). A story gets every category
# whose words appear in its headline or summary (case-insensitive, word start).
categories:
  policy:
    label: Policy & payment
    words: [CMS, Medicare, Medicaid, reimbursement, fee schedule, MPFS, OPPS, prior authorization, payer, payers, insurer, insurance, coverage, legislation, Congress, bill, lawmakers, No Surprises Act, price transparency, RVU, CPT, appropriate use, site-neutral, MIPS, final rule, proposed rule]
  workforce:
    label: Workforce
    words: [shortage, workforce, burnout, staffing, recruit, residency, residents, salary, salaries, compensation, technologist, technologists, teleradiology, locum, hiring, layoff, job, jobs, wellness, diversity]
  ai_industry:
    label: AI & software
    words: [AI, artificial intelligence, algorithm, deep learning, machine learning, large language, LLM, ChatGPT, generative, foundation model, autonomous, software, PACS, cloud, cybersecurity, informatics, enterprise imaging, reporting platform]
  deals:
    label: Business & deals
    words: [acquire, acquires, acquisition, acquired, merger, merge, private equity, funding, raises, investment, investor, IPO, earnings, revenue, quarter, partnership, partners with, joint venture, deal, bankruptcy, closes, expands, expansion, imaging center, outpatient, Radiology Partners, RadNet, Akumin]
  regulatory:
    label: FDA & safety
    words: [FDA, 510(k), clearance, cleared, approval, approves, approved, recall, warning, safety, MQSA, shortage of contrast, contrast shortage, isotope, Mo-99, helium, lawsuit, malpractice, settlement, court, DOJ, fraud, breach]
  technology:
    label: Equipment & tech
    words: [scanner, photon-counting, MRI, CT, PET, SPECT, ultrasound, X-ray, mammography, theranostics, radiopharmaceutical, tracer, installation, installs, launches, unveils, debuts, helium-free, low-field]
