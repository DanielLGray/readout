# ─────────────────────────────────────────────────────────────────────────────
# Readout — news: radiology industry outlets + general science & health outlets
#
# Each outlet lists one or more feed addresses. The news job tries them in
# order and uses the first that returns stories, so a site redesign that
# breaks one address doesn't break the tab. Accepted formats: RSS, Atom, and
# Google News sitemaps (sitemap-google-news.xml).
#
# The app shows each story's headline, outlet, date and the short summary the
# outlet puts in its own feed, and links to the article on the outlet's site.
#
# Add an outlet: copy a block. Remove one: delete it. The "Check news feeds"
# step of the Update news run reports which address each outlet is using.
# ─────────────────────────────────────────────────────────────────────────────

settings:
  keep_days: 120          # radiology industry stories older than this leave the feed
  other_keep_days: 21     # health, science and sci-fi stories (many more of them) leave sooner
  max_items: 4000
  archive_days: 730       # headlines kept (titles only) for trend analysis

# Kinds of news, in the order the app shows them. Every outlet below has one.
kinds:
  industry: Industry news
  health: Health & medicine
  science: Science
  sff: Sci-fi & fantasy

# max_per_day: keep at most this many stories per day from an outlet

# Shopping and promotional posts never make a card (not applied to industry news,
# where "deal" means an acquisition).
exclude: "gift guide|\\bdeals\\b|deal of the day|\\bon sale\\b|% off|coupon|black friday|cyber monday|prime day|sponsored|best .{0,40} to buy|our favorite .{0,30} for 20\\d\\d|subscribe now"

sources:
