# ─────────────────────────────────────────────────────────────────────────────
# Readout — news: radiology industry outlets, science & health, light reading and general news
#
# Each outlet lists one or more feed addresses. The news job tries them in
# order and uses the first that returns stories, so a site redesign that
# breaks one address doesn't break the tab. Accepted formats: RSS, Atom, and
# publishers' own news sitemaps (sitemap-google-news.xml). No Google News feeds:
# Google's News terms allow personal use only, not display on a website.
#
# The app shows each story's headline, outlet, date and the short summary the
# outlet puts in its own feed, and links to the article on the outlet's site.
#
# Per outlet, optional: merge (use every address that works), require (keep only
# stories matching a pattern), skip (drop stories whose link or title matches),
# max_per_day, group (sister sites that syndicate each other).
#
# Add an outlet: copy a block. Remove one: delete it. The "Check news feeds"
# step of the Update news run reports which address each outlet is using.
# ─────────────────────────────────────────────────────────────────────────────

settings:
  keep_days: 120          # radiology industry stories older than this leave the feed
  other_keep_days: 21     # health, science and sci-fi stories (many more of them) leave sooner
  kind_keep_days:         # kinds that post rarely keep their stories longer; news goes stale fast
    societies: 180
    light: 45
    general: 4
    business: 7
  max_items: 4000
  archive_days: 730       # headlines kept (titles only) for trend analysis
  top_stories:            # the first card in the feed
    days: 7               # look back this many days
    min_outlets: 2        # a story needs this many different publishers
    match: 0.5            # how alike two headlines must be to count as one story (0–1)
    per_kind: 8
  trending:               # "In the news" on Explore
    week: [7, 28]         # this week vs the 4 weeks before
    month: [30, 90]       # this month vs the 3 months before
    phrases: 12

# Kinds of news, in the order the app shows them. Every outlet below has one.
# industry and health stories that mention these also show under "ACR & societies"
society_mentions: '\b(?:ACR|SNMMI|RSNA|SCCT|ASNC|EANM|ARRS|SIIM|SCMR)\b|(?i:American College of Radiology|Society of Nuclear Medicine|Radiological Society of North America|Society of Cardiovascular Computed Tomography|American Society of Nuclear Cardiology|European Association of Nuclear Medicine|European Society of Radiology|Society of Interventional Radiology|Society of Abdominal Radiology|Appropriateness Criteria|American Roentgen Ray Society)'

# Alerts: rare and high-bar, pinned at the top of Everything and Today for a week (each can be
# dismissed). A story makes one when its headline matches every `title` pattern of a rule (and its
# headline or summary every `text` pattern), and at least `outlets` outlets carry it (sister
# outlets count once) or a primary source does. Guidelines published in PubMed come from the
# papers job (config/feeds.yaml → alerts).
alerts:
  days: 7
  outlets: 2
  max: 3
  primary: [FDA press releases, FDA safety alerts, ACR (via Medical Xpress), SNMMI (via Medical Xpress), RSNA (via Medical Xpress), SCCT]
  agents: '\bradiopharm\w*|radioligand|radiotracer|\btracers?\b|imaging agent|diagnostic agent|contrast (?:agent|media|medium)|gadolin\w*|\bGBCAs?\b|gadopiclenol|gadoterate|gadobutrol|gadoxetate|Gadavist|Dotarem|Clariscan|Elucirem|Vueway|Eovist|iodinated|Omnipaque|Visipaque|Isovue|\bPSMA\b|lutetium|Lu-?177|177Lu|gallium|Ga-?68|68Ga|\bF-?18\b|18F|fluorine-18|flurpiridaz|Flyrcado|Pluvicto|Locametz|Illuccix|Gozellix|Pylarify|Posluma|Lutathera|Netspot|Detectnet|Axumin|Cerianna|Amyvid|Vizamyl|Neuraceq|Tauvid|technetium|Tc-?99m|99mTc|Mo-?99|molybdenum|iodine-131|I-131|radium-223|Xofigo|actinium|Ac-?225|copper-64|Cu-?64|zirconium|theranostic\w*|microbubble|Lumason|Definity|Optison|PET (?:agent|tracer|imaging agent)'
  societies: '\b(?:ACR|SNMMI|EANM|SCCT|SAR|ASNC|SCMR|AASLD|NCCN|ESC)\b|American College of Radiology|Society of Nuclear Medicine|European Association of Nuclear Medicine|Society of Cardiovascular Computed Tomography|Society of Abdominal Radiology|Fleischner|American Heart Association|American College of Cardiology|ACC/AHA|AHA/ACC|European Society of Cardiology|American Society of Nuclear Cardiology|American Urological Association|American Association for the Study of Liver'
  rules:
    - id: fda
      group: fda
      label: FDA
      title: ['\bFDA\b|Food and Drug Administration', '\b(?:approv\w*|clears|cleared|clearance|authoriz\w*|warn\w*|warning|boxed|safety|recall\w*|label\w*|withdr\w*|shortage\w*|restrict\w*)\b']
      text: ['{agents}']
    - id: uspstf
      group: uspstf
      label: USPSTF
      title: ['USPSTF|Preventive Services Task Force', '\b(?:recommend\w*|guideline\w*|screen\w*|draft|final\w*|propos\w*|lower\w*|expand\w*)\b']
    # "ACS" alone also means acute coronary syndrome: it counts only beside cancer or screening
    - id: acs
      group: acs
      label: American Cancer Society
      title: ['American Cancer Society|\bACS\b', '\b(?:guideline\w*|recommend\w*|screen\w*)\b']
      text: ['\b(?:cancer\w*|screen\w*|tumou?r\w*|oncolog\w*|mammogra\w*|colonoscop\w*|PSA)\b', '\b(?:new|updat\w*|chang\w*|revis\w*|now|lower\w*|expand\w*|broad\w*|first|issu\w*|releas\w*|support\w*|urg\w*)\b']
    - id: society
      group: societies
      label: Guideline
      title: ['{societies}', '\b(?:guideline\w*|guidance|appropriate use|appropriateness criteria|consensus|white paper|position statement|recommendation\w*|\w*-?RADS)\b']
      text: ['\b(?:new|updat\w*|chang\w*|revis\w*|releas\w*|issu\w*|publish\w*|first|now)\b']

kinds:
  industry: Industry news
  societies: ACR & societies
  health: Health & medicine
  science: Science
  light: Light reading
  general: U.S. & world news
  business: Business & markets
  sff: Sci-fi & fantasy

# max_per_day: keep at most this many stories per day from an outlet
# everything_per_day: how many of them Everything shows a day at Tune's default limit of 2; a different
#   limit in Tune moves it by the same amount (3 here and a limit of 4 in Tune: 5 a day)

# Shopping and promotional posts never make a card (not applied to industry or business news,
# where "deal" means an acquisition).
exclude: "gift guide|\\bdeals\\b|deal of the day|\\bon sale\\b|% off|coupon|black friday|cyber monday|prime day|sponsored|best .{0,40} to buy|our favorite .{0,30} for 20\\d\\d|subscribe now"

# Outlets that mostly carry institutions' press releases: in a story, copies of one release from
# any of these count as one source (see "independent sources" in pipeline/news.py).
releases: [sciencex, ScienceDaily, "ACR (via Medical Xpress)", "SNMMI (via Medical Xpress)", "RSNA (via Medical Xpress)", EurekAlert]

sources:
  # group: outlets from the same publisher that share stories count once
  # merge: use every working address (an RSS feed plus a sitemap gives more stories)
  # require: keep only stories whose headline/summary match (for general medtech outlets)
  - name: AuntMinnie
    group: auntminnie
    home: https://www.auntminnie.com
    merge: true
    urls:
      - https://www.auntminnie.com/rss
      - https://www.auntminnie.com/sitemap-google-news.xml

  - name: AuntMinnie Europe
    group: auntminnie
    home: https://www.auntminnieeurope.com
    merge: true
    urls:
      - https://www.auntminnieeurope.com/feed
      - https://www.auntminnieeurope.com/sitemap-google-news.xml

  - name: Radiology Business
    home: https://radiologybusiness.com
    group: innovate
    urls:
      - https://radiologybusiness.com/rss.xml
      - https://radiologybusiness.com/feed

  - name: Cardiovascular Business
    home: https://cardiovascularbusiness.com
    group: innovate            # sister site of Radiology Business
    require: "\\bCT\\b|computed tomography|CCTA|imaging|TAVR|TAVI|transcatheter|structural heart|calcium scor|SCCT|FFR|PET|\\bSPECT\\b|MRI"
    urls:
      - https://cardiovascularbusiness.com/rss.xml
      - https://cardiovascularbusiness.com/feed

  # Medical Xpress (Science X) allows its feeds on other sites, personal or commercial, as long as its
  # credit stays and headlines and links are left as they are (verbatim). Shared stories go to the
  # society feeds below, which come later and win.
  - name: Medical Xpress Radiology
    group: sciencex              # Medical Xpress and Phys.org are one publisher (Science X)
    verbatim: true
    max_per_day: 4
    home: https://medicalxpress.com
    urls:
      - https://medicalxpress.com/rss-feed/diagnostic-radiology-news/

  # Societies. ACR, SNMMI and RSNA have no news feed of their own; their press releases reach
  # Medical Xpress, which publishes a feed for each organization. SCCT publishes its own feed.
  - name: ACR (via Medical Xpress)
    kind: societies
    verbatim: true
    max_per_day: 3
    home: https://medicalxpress.com
    stale_days: 90
    urls:
      - https://medicalxpress.com/rss-feed/partners/american-college-of-radiology/

  - name: SNMMI (via Medical Xpress)
    kind: societies
    verbatim: true
    max_per_day: 3
    home: https://medicalxpress.com
    stale_days: 90
    merge: true
    urls:
      - https://medicalxpress.com/rss-feed/partners/society-of-nuclear-medicine-and-molecular-imaging/
      - https://medicalxpress.com/rss-feed/partners/society-of-nuclear-medicine/

  - name: RSNA (via Medical Xpress)
    kind: societies
