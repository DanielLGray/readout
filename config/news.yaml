      - https://scct.org/news/news_rss.asp

  # The FDA's own feeds (U.S. government works, free to use): only what touches imaging, contrast
  # or radiopharmaceuticals. They're the primary source for FDA alerts.
  - name: FDA press releases
    home: https://www.fda.gov
