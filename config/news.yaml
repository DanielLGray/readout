# Business categories (chips in the News tab). A story gets every category
# whose words appear in its headline or summary (case-insensitive, word start).
categories:
  policy:
    label: Policy & payment
    words: [CMS, Medicare, Medicaid, reimbursement, fee schedule, MPFS, OPPS, prior authorization, payer, payers, insurer, insurance, coverage, legislation, Congress, bill, lawmakers, No Surprises Act, price transparency, RVU, CPT, appropriate use, site-neutral, MIPS, final rule, proposed rule]
  workforce:
    label: Workforce
    words: [shortage, workforce, burnout, staffing, recruit, residency, residents, salary, salaries, compensation, technologist, technologists, teleradiology, locum, hiring, layoff, job, jobs, wellness, diversity]
  ai_industry:
    label: AI & software
    words: [AI, artificial intelligence, algorithm, deep learning, machine learning, large language, LLM, ChatGPT, generative, foundation model, autonomous, software, PACS, cloud, cybersecurity, informatics, enterprise imaging, reporting platform]
  deals:
    label: Business & deals
    words: [acquire, acquires, acquisition, acquired, merger, merge, private equity, funding, raises, investment, investor, IPO, earnings, revenue, quarter, partnership, partners with, joint venture, deal, bankruptcy, closes, expands, expansion, imaging center, outpatient, Radiology Partners, RadNet, Akumin]
  regulatory:
    label: FDA & safety
    words: [FDA, 510(k), clearance, cleared, approval, approves, approved, recall, warning, safety, MQSA, shortage of contrast, contrast shortage, isotope, Mo-99, helium, lawsuit, malpractice, settlement, court, DOJ, fraud, breach]
  technology:
    label: Equipment & tech
    words: [scanner, photon-counting, MRI, CT, PET, SPECT, ultrasound, X-ray, mammography, theranostics, radiopharmaceutical, tracer, installation, installs, launches, unveils, debuts, helium-free, low-field]
