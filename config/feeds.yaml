# ─────────────────────────────────────────────────────────────────────────────
# Readout — feed configuration
#
# Everything here is a PubMed query, so every card in the app traces back to a
# PubMed record (PMID) with the authors' own abstract. Edit freely:
#   • add/remove journals in `journals`
#   • widen/narrow the body-imaging filter in `body_filter`
#   • add whole new streams at the bottom
# A placeholder like {journals} or {body_filter} is filled in with the block of
# that name below; any block can be used this way.
# Query syntax help: https://pubmed.ncbi.nlm.nih.gov/help/
# ─────────────────────────────────────────────────────────────────────────────

settings:
  first_run_days: 45        # how far back a stream's very first run looks
  recheck_days: 30          # later runs re-check this many days (abstracts often arrive weeks late)
  keep_days: 180            # default for areas that don't set their own
  max_items: 2500           # hard cap on cards kept in the feed

# Interest areas. Every stream below belongs to one. In the app (Tune → Interests) you turn
# areas on or off and choose how much of the feed each gets. keep_days: how long its papers stay.
areas:
  nm:
    label: Nuclear medicine
    short: NM
    keep_days: 60
    about: Every original paper in the nuclear medicine journals — oncology, theranostics, cardiac, neuro, thyroid.
  body:
    label: Body imaging
    short: Body
    keep_days: 180
    about: Abdomen and pelvis in radiology and nuclear medicine journals, plus imaging papers in high-impact clinical journals.
  cardiac:
    label: Cardiac & vascular CT
    short: Cardiac CT
    keep_days: 120
    about: TAVR planning CT, coronary CT angiography, CT-FFR, calcium scoring and vascular CT.
    # must mention CT itself: "computed tomography" also matches SPECT and PET, and "CT" PET/CT
    require: '(?<!PET/)(?<!PET-)(?<!SPECT/)(?<!SPECT-)\bCT\b(?!/)|\bCTA\b|CCTA|CT-?FFR|FFR-?CT|[Cc]omputed [Tt]omograph(?:y|ic) [Aa]ngiograph|(?:[Cc]ardiac|[Cc]oronary|[Cc]ardiovascular) [Cc]omputed [Tt]omograph|[Cc]alcium scor|Agatston|[Pp]hoton-counting'
  general:
    label: General radiology
    short: General
    keep_days: 45
    about: Radiology, AJR, RadioGraphics and JACR — every subspecialty, plus practice, quality and policy.

# "Most important" in the app: every paper from the streams below over the last few years,
# ranked by citations against papers in the same area published the same quarter (NIH iCite).
# Built weekly; each area gets its own lists.
important:
  years: 3                 # how far back to look
  per_window: {6m: 30, 1y: 40, 3y: 60}   # original research papers kept per list, per area
  other_per_window: 10     # reviews, meta-analyses and guidelines per list and area (shown if you turn them on)
  min_age_months: 4        # the 1- and 3-year lists skip papers younger than this (too new to judge)

# Radiology journals that carry most body-imaging research and education.
journals:
  - '"Radiology"[ta]'
  - '"Radiographics"[ta]'
  - '"AJR Am J Roentgenol"[ta]'
  - '"Eur Radiol"[ta]'
  - '"Abdom Radiol (NY)"[ta]'
  - '"Invest Radiol"[ta]'
  - '"Radiol Imaging Cancer"[ta]'
  - '"J Magn Reson Imaging"[ta]'
  - '"Eur J Radiol"[ta]'
  - '"Korean J Radiol"[ta]'
  - '"Insights Imaging"[ta]'
  - '"Radiol Artif Intell"[ta]'
  - '"J Am Coll Radiol"[ta]'

# Nuclear medicine journals.
nm_journals:
  - '"J Nucl Med"[ta]'
  - '"Eur J Nucl Med Mol Imaging"[ta]'
  - '"Clin Nucl Med"[ta]'
  - '"Semin Nucl Med"[ta]'
  - '"J Nucl Cardiol"[ta]'
  - '"EJNMMI Res"[ta]'
  - '"Ann Nucl Med"[ta]'

# The core general radiology journals (every subspecialty).
general_radiology_journals:
  - '"Radiology"[ta]'
  - '"AJR Am J Roentgenol"[ta]'
  - '"Radiographics"[ta]'
  - '"J Am Coll Radiol"[ta]'

# Cardiovascular imaging journals (CT papers are pulled from these).
cardiac_journals:
  - '"J Cardiovasc Comput Tomogr"[ta]'
  - '"JACC Cardiovasc Imaging"[ta]'
  - '"Radiol Cardiothorac Imaging"[ta]'
  - '"Circ Cardiovasc Imaging"[ta]'
  - '"Eur Heart J Cardiovasc Imaging"[ta]'

# Interventional cardiology journals (TAVR planning-CT papers are pulled from these).
interventional_journals:
  - '"JACC Cardiovasc Interv"[ta]'
  - '"EuroIntervention"[ta]'
  - '"Catheter Cardiovasc Interv"[ta]'

# High-impact clinical journals — only imaging papers are pulled from these.
general_journals:
  - '"N Engl J Med"[ta]'
  - '"Lancet"[ta]'
  - '"JAMA"[ta]'
  - '"BMJ"[ta]'
  - '"Lancet Oncol"[ta]'
  - '"JAMA Oncol"[ta]'
  - '"J Clin Oncol"[ta]'
  - '"Gastroenterology"[ta]'
  - '"Hepatology"[ta]'
  - '"J Hepatol"[ta]'
  - '"Eur Urol"[ta]'
  - '"Ann Intern Med"[ta]'

# Alerts: new guidelines and recommendation statements, pinned at the top of Everything and Today
# for a week from the day PubMed lists them (news-based alerts: config/news.yaml → alerts).
# group: which switch in Tune → Rules → Alerts turns it off (uspstf, acs or societies).
alerts:
  days: 7
  lookback: 14
  max: 4
  rules:
    - id: uspstf
      group: uspstf
      label: USPSTF
      query: '"US Preventive Services Task Force"[cn] AND recommendation[ti] AND statement[ti]'
    - id: acs
      group: acs
      label: American Cancer Society
      query: '"CA Cancer J Clin"[ta] AND (guideline[ti] OR guidelines[ti]) NOT (Comment[pt] OR "Published Erratum"[pt])'
    - id: fleischner
      group: societies
      label: Fleischner Society
      query: 'Fleischner[ti] AND (guideline[ti] OR guidelines[ti] OR statement[ti] OR recommendation[ti] OR recommendations[ti] OR "white paper"[ti] OR position[ti])'
    - id: snmmi
      group: societies
      label: SNMMI / EANM
      query: '(SNMMI[ti] OR EANM[ti] OR "Society of Nuclear Medicine"[ti] OR "European Association of Nuclear Medicine"[ti]) AND (guideline[ti] OR guidelines[ti] OR "procedure standard"[ti] OR "appropriate use"[ti] OR consensus[ti]) NOT (Comment[pt] OR "Published Erratum"[pt] OR Letter[pt])'
    - id: scct
      group: societies
      label: SCCT
      query: '(SCCT[ti] OR "Society of Cardiovascular Computed Tomography"[ti]) AND (guideline[ti] OR guidelines[ti] OR consensus[ti] OR "appropriate use"[ti] OR statement[ti]) NOT (Comment[pt] OR "Published Erratum"[pt] OR Letter[pt])'
    - id: acr
      group: societies
      label: ACR / SAR
      query: '("white paper"[ti] OR "consensus guideline"[ti] OR "consensus statement"[ti] OR "practice parameter"[ti]) AND (ACR[ti] OR "American College of Radiology"[ti] OR "Society of Abdominal Radiology"[ti] OR SAR[ti]) NOT (Comment[pt] OR "Published Erratum"[pt] OR Letter[pt])'
    - id: acc_aha
      group: societies
      label: ACC/AHA
      query: '("Circulation"[ta] OR "J Am Coll Cardiol"[ta]) AND ACC[ti] AND AHA[ti] AND guideline[ti] NOT (Comment[pt] OR "Published Erratum"[pt])'
    - id: esc
      group: societies
      label: ESC
      query: '"Eur Heart J"[ta] AND ESC[ti] AND guidelines[ti] NOT (Comment[pt] OR "Published Erratum"[pt])'
    - id: aasld
      group: societies
      label: AASLD
      query: '"Hepatology"[ta] AND AASLD[ti] AND (guidance[ti] OR guideline[ti]) NOT (Comment[pt] OR "Published Erratum"[pt])'

# Outside your areas: one paper a day in Today from the big general and specialty journals, from
# the last few months, that none of your area searches found, ranked by early citations (NIH iCite)
# and study design. Built by the weekly Most important job.
wide:
  months: 6
  keep: 40
  query: '({wide_journals}) AND (Journal Article[pt] OR Randomized Controlled Trial[pt] OR Meta-Analysis[pt]) NOT ({exclude} OR "Case Reports"[pt]) NOT ({imaging_title})'
wide_journals:
  - '"N Engl J Med"[ta]'
  - '"Lancet"[ta]'
  - '"JAMA"[ta]'
  - '"BMJ"[ta]'
  - '"Nat Med"[ta]'
  - '"Ann Intern Med"[ta]'
  - '"JAMA Intern Med"[ta]'
  - '"Lancet Oncol"[ta]'
  - '"J Clin Oncol"[ta]'
  - '"JAMA Oncol"[ta]'
  - '"Circulation"[ta]'
  - '"Eur Heart J"[ta]'
  - '"J Am Coll Cardiol"[ta]'

# Abdomen & pelvis vocabulary (title/abstract words). Keeps neuro/MSK/breast
# papers out of the radiology-journal stream.
body_filter: >-
  liver[tiab] OR hepat*[tiab] OR cirrho*[tiab] OR "LI-RADS"[tiab] OR HCC[tiab] OR
  pancrea*[tiab] OR IPMN[tiab] OR biliary[tiab] OR "bile duct"[tiab] OR cholangi*[tiab] OR
  gallbladder[tiab] OR spleen[tiab] OR splenic[tiab] OR
  bowel[tiab] OR colon[tiab] OR colorectal[tiab] OR rectal[tiab] OR rectum[tiab] OR
  gastric[tiab] OR esophag*[tiab] OR duoden*[tiab] OR crohn*[tiab] OR colitis[tiab] OR
  appendic*[tiab] OR peritone*[tiab] OR mesenter*[tiab] OR retroperiton*[tiab] OR
  enterograph*[tiab] OR hernia[tiab] OR abdom*[tiab] OR pelvi*[tiab] OR
  kidney*[tiab] OR renal[tiab] OR adrenal[tiab] OR bladder[tiab] OR urothel*[tiab] OR
  prostat*[tiab] OR "PI-RADS"[tiab] OR Bosniak[tiab] OR testic*[tiab] OR scrot*[tiab] OR
  uterine[tiab] OR uterus[tiab] OR endometri*[tiab] OR ovar*[tiab] OR adnexa*[tiab] OR
  "O-RADS"[tiab] OR "cervical cancer"[tiab] OR cervix[tiab] OR placenta*[tiab] OR
  neuroendocrine[tiab] OR PSMA[tiab] OR DOTATATE[tiab] OR lymphoma[tiab]

imaging_terms: >-
  imaging[tiab] OR MRI[tiab] OR "magnetic resonance"[tiab] OR "computed tomography"[tiab] OR
  CT[tiab] OR ultrasound[tiab] OR ultrasonograph*[tiab] OR sonograph*[tiab] OR PET[tiab] OR
  "positron emission"[tiab] OR radiolog*[tiab] OR scintigraph*[tiab] OR SPECT[tiab]

# For the high-impact general journals, imaging has to be what the paper is about: in its title,
# or a major MeSH heading. (In the abstract alone it lets in drug trials that measured response on CT.)
imaging_title: >-
  imaging[ti] OR MRI[ti] OR "magnetic resonance"[ti] OR "computed tomography"[ti] OR CT[ti] OR
  ultrasound[ti] OR ultrasonograph*[ti] OR sonograph*[ti] OR elastograph*[ti] OR PET[ti] OR
  "positron emission"[ti] OR PSMA[ti] OR radiolog*[ti] OR radiomic*[ti] OR scintigraph*[ti] OR SPECT[ti] OR
  theranostic*[ti] OR radioligand*[ti] OR radionuclide*[ti] OR lutetium[ti] OR DOTATATE[ti] OR
  "Diagnostic Imaging"[majr] OR "Radiopharmaceuticals"[majr] OR "Radiology"[majr]

ct_terms: >-
  CT[tiab] OR CCTA[tiab] OR CTA[tiab] OR "CT angiography"[tiab] OR "CT angiographic"[tiab] OR "CT-FFR"[tiab] OR
  FFRCT[tiab] OR "calcium score"[tiab] OR "calcium scoring"[tiab] OR "computed tomography angiography"[tiab] OR
  "cardiac computed tomography"[tiab] OR "coronary computed tomography"[tiab] OR "photon-counting"[tiab]

tavr_terms: >-
  TAVR[tiab] OR TAVI[tiab] OR "transcatheter aortic"[tiab] OR "aortic stenosis"[tiab] OR "aortic annulus"[tiab] OR
  "aortic valve replacement"[tiab] OR "valve-in-valve"[tiab] OR "structural heart"[tiab]

cardiac_terms: >-
  {tavr_terms} OR coronary[tiab] OR cardiac[tiab] OR myocard*[tiab] OR aorta[tiab] OR aortic[tiab] OR
  "pulmonary vein*"[tiab] OR "left atrial"[tiab] OR endoleak[tiab]

# Publication types that never make a useful card.
exclude: >-
  "Published Erratum"[pt] OR Editorial[pt] OR Letter[pt] OR Comment[pt] OR News[pt]

streams:
  - id: body_journals
    area: body
    name: Body imaging — radiology journals
    query: '({journals}) AND ({body_filter}) NOT ({exclude})'

  - id: nm_body
    area: body
    name: Nuclear medicine — body & oncology
    query: '({nm_journals}) AND ({body_filter}) NOT ({exclude})'

  - id: general_imaging
    area: body
    name: High-impact journals — imaging papers
    query: '({general_journals}) AND ({imaging_title}) AND ({body_filter}) NOT ({exclude})'

  - id: nm_all
    area: nm
    name: Nuclear medicine journals — everything
    query: '({nm_journals}) NOT ({exclude} OR "Case Reports"[pt])'

  - id: cardiac_ct
    area: cardiac
    name: Cardiovascular imaging journals — CT
    query: '({cardiac_journals}) AND ({ct_terms}) NOT ({exclude})'

  - id: cardiac_radiology
    area: cardiac
    name: Radiology journals — cardiac and vascular CT
    query: '({journals}) AND ({cardiac_terms}) AND ({ct_terms}) NOT ({exclude})'

  - id: tavr_ct
    area: cardiac
    name: Interventional cardiology journals — TAVR planning CT
    query: '({interventional_journals}) AND ({tavr_terms}) AND ({ct_terms}) NOT ({exclude})'

  - id: general_radiology
    area: general
    name: General radiology journals — everything
    query: '({general_radiology_journals}) NOT ({exclude} OR "Case Reports"[pt])'

# Organ-system chips in the Feed. Each card gets every system whose words
# appear in its title or abstract (case-insensitive, word-start match).
systems:
  liver:
    label: Liver
    words: [liver, hepat, cirrho, LI-RADS, LIRADS, HCC, steato, MASLD, MASH, NAFLD, NASH, portal vein, gadoxet]
  pancreas_biliary:
    label: Pancreas & biliary
    words: [pancrea, IPMN, biliary, bile duct, cholangi, gallbladder, MRCP, ampulla, PDAC]
  gi:
    label: GI & peritoneum
    words: [bowel, {word: colon, not: "y|ies|ial|ials|i[sz]ation|i[sz]ed?|ist|ists|el|els"}, colorectal, rectal, rectum, gastric, stomach, esophag, oesophag, duoden, small intestin, crohn, colitis, appendic, peritone, mesenter, hernia, enterograph]
  gu:
    label: GU & adrenal
    words: [kidney, renal, {word: adrenal, not: "ine"}, bladder, ureter, urothel, prostat, testic, scrot, PI-RADS, PIRADS, Bosniak, VI-RADS]
  gyn:
    label: Gyn & pelvis
    words: [uterus, uterine, endometri, ovary, ovarian, adnex, cervical cancer, cervix, O-RADS, placenta, fibroid, leiomyom, vulv, vagin, pelvic floor]
  onc_nm:
    label: Onc & NM
    words: [PET, PSMA, FAPI, DOTATATE, DOTATOC, theranost, radioligand, PRRT, lutetium, 177Lu, Lu-177, SPECT, scintigra, FDG, radiopharm, RECIST, PERCIST, radionuclide]
  cardiac:
    label: Cardiac & vascular
    words: [heart, cardiac, coronary, myocard, aortic valve, aortic stenosis, TAVR, TAVI, transcatheter, annulus, CCTA, CAD-RADS, calcium scor, Agatston, FFR, aorta, aortic, endoleak, carotid, atrial, ventric]
  chest:
    label: Chest
    words: [lung, pulmonary, thorac, pleura, mediastin, emphysema, interstitial, bronch, Lung-RADS, airway]
  neuro:
    label: Neuro
    words: [brain, cerebr, neuro, stroke, glioma, glioblastoma, dementia, Alzheimer, amyloid, tau, Parkinson, epilep, intracranial, head and neck]
  msk:
    label: MSK
    words: [bone, joint, knee, shoulder, hip, musculoskeletal, cartilage, tendon, fracture, osteo, sarcoma, spine, spinal]
  breast:
    label: Breast
    words: [breast, mammogra, BI-RADS, tomosynthesis]
  thyroid:
    label: Thyroid & endocrine
    words: [thyroid, parathyroid, radioiodine, I-131, 131I, Graves, pheochromocytoma, paraganglioma]
  practice:
    label: Practice & policy
    words: [workforce, burnout, reimbursement, Medicare, appropriateness criteria, quality improvement, health policy, CMS, payment, staffing, residency, teleradiology, peer learning, patient experience]
  tech_ai:
    label: Tech & AI
    words: [deep learning, artificial intelligence, machine learning, radiomic, large language, LLM, ChatGPT, GPT-4, photon-counting, photon counting, dual-energy, dual energy, spectral CT, image reconstruction, neural network, foundation model, convolutional]
