# Personal finance. Tax deadlines and the big sales weekends are worked out each year from the IRS's
# rules and the holiday calendar; these are the words that go with them.
finance:
  limits:                # the IRS announces next year's limits each fall: add a year when it does
    2027:
      sub: "401(k), 403(b) and 457: $25,500 (catch-up at 50+: $8,500; at 60–63: $11,750). IRA: $7,500 (catch-up $1,100). HSA: $4,500 self-only, $9,000 family."
      about: "From IRS news release IR-2026-136 (Nov 12, 2026) and Rev. Proc. 2026-24. Check your own plan's rules too."
      url: https://www.irs.gov/newsroom/401k-limit-increases-to-25500-for-2027-ira-limit-remains-7500
      src: IRS
  buys:                  # month by month: the usual pattern consumer sites report, in my words
    1: "TVs (last year's models, before the Super Bowl), bedding and linens, fitness gear, winter clothing on clearance"
    2: "TVs ahead of the Super Bowl; mattresses and appliances around Presidents' Day"
    3: "Luggage, winter coats and gear on clearance"
    4: "Vacuums, grills and garden gear as spring sales start"
    5: "Mattresses and appliances around Memorial Day; patio furniture"
    6: "Tools around Father's Day; summer electronics deals begin"
    7: "Electronics and appliances during the July sales (Amazon's Prime Day is usually this month)"
    8: "Laptops and back-to-school tech; patio furniture and summer gear on clearance"
    9: "Appliances and mattresses around Labor Day; last year's iPhones after Apple's September launch; outgoing car models as new ones arrive"
    10: "Laptops and electronics in the October sales events; last year's cars still being cleared"
    11: "TVs, electronics and toys around Black Friday and Cyber Monday"
    12: "Cars, as dealers push to hit year-end targets; after Christmas, holiday décor and gift sets"
    presidents: "Mattresses and major appliances"
    memorial: "Mattresses, major appliances, grills and outdoor furniture"
    july4: "Summer gear, appliances and electronics"
    labor: "Appliances, mattresses and the end of summer clearance"
    blackfriday: "TVs, electronics, toys and small appliances: often the year's lowest prices on TVs"
    cybermonday: "Online deals on laptops, phones, smart-home gear and more"
    dec26: "Holiday décor, wrapping and gift sets; returns and exchanges"

