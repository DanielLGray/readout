    about: A "ring of fire" eclipse, annular in southern Chile and Argentina, partial across South America and western Africa. Not visible from North America.
    url: https://science.nasa.gov/eclipses/future-eclipses/
  - id: eclipse-2027-02-20
    kind: science
    title: Penumbral lunar eclipse
