    about: The Moon dims slightly in Earth's outer shadow, a subtle one.
    url: https://eclipse.gsfc.nasa.gov/OH/OH2027.html
  - id: eclipse-2027-07-18
    kind: science
    title: Penumbral lunar eclipse
    start: 2027-07-18
    about: The Moon dims slightly in Earth's outer shadow, a subtle one.
    url: https://eclipse.gsfc.nasa.gov/OH/OH2027.html
  - id: eclipse-2027-08-02
