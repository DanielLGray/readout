    title: Total solar eclipse
    start: 2027-08-02
    about: One of the longest totalities of the century, over 6 minutes, across southern Spain, North Africa (Morocco to Egypt), Saudi Arabia and Yemen.
    url: https://science.nasa.gov/eclipses/future-eclipses/
  - id: eclipse-2027-08-17
    kind: science
    title: Penumbral lunar eclipse
    start: 2027-08-17
    about: The Moon dims slightly in Earth's outer shadow, a subtle one.
    url: https://eclipse.gsfc.nasa.gov/OH/OH2027.html
  - id: eclipse-2028-01-26
