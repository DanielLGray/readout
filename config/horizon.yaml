# Expected, but no date set yet: listed at the end of Coming up until a date is announced
# (then move it to events above).
unscheduled:
  - kind: news
    title: State of the Union
    when: Usually late January to early March; the date is set when the Speaker of the House invites the president.
  - kind: news
    title: Apple's WWDC
    when: Usually the first or second week of June; Apple announces it in March.
  - kind: news
    title: End of the Supreme Court term
    when: The biggest decisions usually come in the last two weeks of June.
  - kind: money
    title: Amazon Prime Day
    when: Usually mid-July; Amazon announces it a few weeks ahead. Other big retailers run sales the same week.
  - kind: culture
    title: Met Gala
    when: Usually the first Monday in May.
  - kind: culture
    title: Emmy Awards
    when: Usually mid-September.
  - kind: culture
    title: Hugo Awards
    when: Presented at Worldcon, usually in August.
  - kind: culture
    title: Hot August Nights, Reno
    when: Usually the first full week of August.
  - kind: culture
    title: Great Reno Balloon Race
    when: Usually the weekend after Labor Day, at Rancho San Rafael Park.
